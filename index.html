<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Hpoo Hpoo 🕷️❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 135, 0.4);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            color: #d81b60;
            font-size: 20px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s ease;
        }
        .btn-yes {
            background-color: #e91e63;
            color: white;
        }
        .btn-yes:hover {
            background-color: #ff6090;
        }
        .btn-no {
            background-color: #bdbdbd;
            color: #333;
        }
        .btn-no:hover {
            background-color: #e0e0e0;
        }
        .result-box {
            display: none;
            font-size: 16px;
            color: #880e4f;
            line-height: 1.6;
            animation: fadeIn 0.5s ease;
        }
        .spider-icon {
            width: 150px;
            height: 150px;
            margin: 15px auto;
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="questionBox">
            <h1>Hpoo Hpoo စိတ်ဆိုးနေတာလား? 🥺</h1>
            <div class="btn-group">
                <button class="btn-yes" onclick="showResult('yes')">Yes</button>
                <button class="btn-no" onclick="showResult('no')">No</button>
            </div>
        </div>

        <div id="resultBox" class="result-box"></div>
    </div>

    <script>
        function showResult(answer) {
            document.getElementById('questionBox').style.display = 'none';
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';

            // Spider-Man SVG Graphic Code
            const spidermanSVG = `
                <svg class="spider-icon" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="#e53935"/>
                    <path d="M50 5 L50 95 M5 50 L95 50 M18 18 L82 82 M18 82 L82 18" stroke="#212121" stroke-width="1.5" opacity="0.6"/>
                    <path d="M50 25 Q35 35 50 45 Q65 35 50 25 Z" fill="none" stroke="#212121" stroke-width="1"/>
                    <path d="M50 15 Q25 35 50 55 Q75 35 50 15 Z" fill="none" stroke="#212121" stroke-width="1"/>
                    <!-- Eyes -->
                    <polygon points="20,35 42,48 38,28" fill="#ffffff" stroke="#212121" stroke-width="3"/>
                    <polygon points="80,35 58,48 62,28" fill="#ffffff" stroke="#212121" stroke-width="3"/>
                </svg>
            `;

            if (answer === 'yes') {
                resultBox.innerHTML = `
                    ${spidermanSVG}
                    <p>စိတ်မဆိုးပါနဲ့ Hpoo Hpoo ကလည်း...</p>
                    <br>
                    <p><strong>Messenger မှာ စာပြန်ပါဦးနော်! ❤️🕷️</strong></p>
                `;
            } else if (answer === 'no') {
                resultBox.innerHTML = `
                    ${spidermanSVG}
                    <p>စိတ်မဆိုးရင်လည်း Messenger မှာ စာပြန်ပါဦး...</p>
                    <br>
                    <p><strong>Hpoo Hpoo ကလည်း နော်... 🥰🕸️</strong></p>
                `;
            }
        }
    </script>

</body>
</html>
